x-commun: &commun                                # Bloc réutilisable (le préfixe x- est ignoré par Compose)
  network_mode: host                             # Réseau de la machine : 127.0.0.1 = l'hôte
  restart: unless-stopped                        # Redémarre après plantage ou reboot, sauf arrêt manuel

services:
  prometheus:                                    # Collecte des métriques
    <<: *commun                                  
    image: prom/prometheus:3.16.0                # Version figée
    command:                                     # Arguments de Prometheus
      - --config.file=/etc/prometheus/prometheus.yml   # Fichier de config dans le conteneur (les 2 jobs)
      - --storage.tsdb.retention.time=90d        # Garde les données 90 jrs
      - --web.listen-address=127.0.0.1:9090      # Interface web en local uniquement
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro   # Votre config, en lecture seule
      - prom_data:/prometheus                    # Données persistantes

  grafana:                                       # Affichage des dashboards
    <<: *commun
    image: grafana/grafana:13.3.2                # Version figée
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1             # Accessible en local uniquement
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # Accès sans compte
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin          # L'utilisateur anonyme a tous les droits
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro  # Src de données et config auto
      - ./grafana/dashboards:/etc/grafana/dashboards:ro      # Dashboards chargés au démarrage
      - grafana_data:/var/lib/grafana            # Base interne persistante

  gpu-exporter:                                  # Métriques GPU via nvidia-smi
    <<: *commun
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1 # Version figée (voir plus bas)
    command: ["--web.listen-address=127.0.0.1:9835"]  # Port attendu par prometheus.yml
    gpus: all                                    # Donne accès aux GPU NVIDIA

volumes:                                         # Volumes nommés, conservés entre redémarrages
  prom_data:
  grafana_data: