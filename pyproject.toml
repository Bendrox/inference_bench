[project]
name = "inference-bench"
version = "0.1.0"
description = "Reproducible vLLM serving benchmarks on a single consumer GPU: concurrency, SLO goodput, workload profiles, power limits."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "modal>=1.6.4",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "termplotlib>=0.3.9",
    "torch>=2.13.0",
    "vllm>=0.31.0",
]

[project.scripts]
inference-bench = "inference_bench.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
