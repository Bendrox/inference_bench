host: 127.0.0.1
port: 8000
gpu-memory-utilization: 0.9
seed: 0
model: Qwen/Qwen3.5-9B
quantization: fp8_per_tensor
limit-mm-per-prompt: '{"image": 0, "video": 0}'
max-model-len: 8192 # limite  maximale du contexte d'une séquence unique
max-num-seqs: 256
max-num-batched-tokens: 8192 # limite tokens traités en même temps dans un lot (batch).
max-concurrency: 256
kv-cache-dtype: fp8
no-enable-prefix-caching: True
